name: Update data and publish site

on:
  push:
    branches: [main]
  schedule:
    # Weekdays 15:30 UTC (16:30 Dublin in winter, 17:30 in summer), after the ECB publishes its rates
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh bond and FX data
        if: github.event_name != 'push'
        run: |
          pip install requests beautifulsoup4
          python scripts/update_data.py

      - name: Save new data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update bond data $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
